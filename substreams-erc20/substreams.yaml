specVersion: v0.1.0
package:
  name: erc20_indexer
  version: v0.1.0

protobuf:
  files:
    - erc20.proto
  importPaths:
    - ../proto

binaries:
  default:
    type: wasm/rust-v1
    file: target/wasm32-unknown-unknown/release/substreams_erc20.wasm

modules:
  - name: map_transfers
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:erc20.types.v1.Transfers
